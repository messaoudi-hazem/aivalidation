services:
  - type: web
    name: resume-screening-rag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python demo/interactive/ingest_data.py
    startCommand: streamlit run demo/interface.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_PATH
        value: ./data/main-data/synthetic-resumes.csv
      - key: FAISS_PATH
        value: ./vectorstore-fastembed
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: GROQ_API_KEY
        sync: false
